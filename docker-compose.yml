# Clean-clone demo stack (step 05-01): one ledgerops binary, one Postgres 16.
#
# Two-role setup per OPS-2/OPS-10: `migrate` runs the image's `ledgerops
# migrate` as the privileged `ledgerops_migrate` role and exits before `app`
# starts. It creates `ledgerops_app` and sets its password last (ADR-017);
# compose only supplies the bootstrap migrate role via the postgres image env.
# `app` then connects only as `ledgerops_app` (LEDGEROPS_APP_DSN), never as
# the migrate role.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerops_migrate
      POSTGRES_PASSWORD: migrate-secret
      POSTGRES_DB: ledgerops
    # -h 127.0.0.1 forces this over TCP, not the Unix socket. The official
    # postgres image's first boot on a fresh volume runs initdb, briefly
    # comes up listening on the socket ONLY (no TCP yet), then restarts to
    # apply config and opens TCP after that. A socket-only pg_isready (the
    # default, no -h) can report healthy during that first pass, letting
    # `migrate` connect too early and hit connection refused. -h 127.0.0.1
    # only succeeds once TCP is actually listening, i.e. after the restart.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ledgerops_migrate -d ledgerops"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerops:demo
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    # The migration credential and the demo app password live here only; the
    # app service never receives LEDGEROPS_MIGRATE_DSN (no shared env_file or
    # anchor). app-secret is the demo password, set explicitly.
    environment:
      LEDGEROPS_MIGRATE_DSN: postgres://ledgerops_migrate:migrate-secret@postgres:5432/ledgerops?sslmode=disable
      LEDGEROPS_APP_PASSWORD: app-secret
    restart: "no"

  app:
    image: ledgerops:demo
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGEROPS_APP_DSN: postgres://ledgerops_app:app-secret@postgres:5432/ledgerops?sslmode=disable
      LEDGEROPS_OPERATOR_KEY: demo-operator-key
      # OPS-10/OPS-11 (step 02-05): the credential demo-01..03/chaos-01/
      # race-02/race-03 present on the three tenant-key-only routes
      # (POST /accounts, POST /transfers, GET /accounts/{id}) -- resolves to
      # tnt_legacy_seed, the sentinel tenant migration 0003 backfills every
      # pre-multitenancy row to (cmd/api/main.go's demoTenantResolver).
      LEDGEROPS_DEMO_TENANT_KEY: demo-tenant-key
      LEDGEROPS_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: "no"

  # --- manual demo aids (not part of the OPS-5 acceptance path) -------------
  # Real Prometheus + Grafana so metrics can be demoed as live graphs rather
  # than scraped exposition text. GET /metrics stays unauthenticated, so
  # prometheus.yml needs no credentials.
  prometheus:
    image: prom/prometheus:v3.14.0
    # --web.enable-remote-write-receiver (OPS-12): setting a custom command
    # replaces the image's default entrypoint args, so --config.file must be
    # restated explicitly alongside it. Receiver lets the load-test workflow's
    # k6 run write straight into this Prometheus via experimental-prometheus-rw.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
