# Clean-clone demo stack (step 05-01): one ledgerops binary, one Postgres 16.
#
# Two-role setup per OPS-2/OPS-10: `migrate` runs the SQL in
# internal/adapters/postgres/migrations against the privileged
# `ledgerops_migrate` role and exits before `app` starts. The roles
# themselves (including `ledgerops_app`) are created BY that SQL
# (0001_init.up.sql), not by this file — compose only supplies the
# already-provisioned migrate role via the postgres image's bootstrap env.
# `app` then connects only as `ledgerops_app` (LEDGEROPS_APP_DSN), never as
# the migrate role.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerops_migrate
      POSTGRES_PASSWORD: migrate-secret
      POSTGRES_DB: ledgerops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerops_migrate -d ledgerops"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./internal/adapters/postgres/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://ledgerops_migrate:migrate-secret@postgres:5432/ledgerops?sslmode=disable"
      - "up"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGEROPS_APP_DSN: postgres://ledgerops_app:app-secret@postgres:5432/ledgerops?sslmode=disable
      LEDGEROPS_OPERATOR_KEY: demo-operator-key
      LEDGEROPS_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: "no"

  # --- manual demo aids (not part of the OPS-5 acceptance path) -------------
  # Real Prometheus + Grafana so metrics can be demoed as live graphs rather
  # than scraped exposition text. GET /metrics stays unauthenticated, so
  # prometheus.yml needs no credentials.
  prometheus:
    image: prom/prometheus:v3.14.0
    # --web.enable-remote-write-receiver (OPS-12): setting a custom command
    # replaces the image's default entrypoint args, so --config.file must be
    # restated explicitly alongside it. Receiver lets the load-test workflow's
    # k6 run write straight into this Prometheus via experimental-prometheus-rw.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
