- id: OUT-18
  kind: operation
  summary: '`release.Classify` maps (pushed tag, tags in the registry package) to a ReleasePlan (DDD-36,
    DDD-50).'
  feature: container-image-release
  inputs:
  - shape: a git tag and the raw tag list of the registry package (404 for an unknown package is the empty
      list)
  output:
    shape: ReleasePlan{version, tags, prerelease, moveLatest, highestStable, resumed} or ErrNotAVersionTag;
      signature and non-version tags are ignored
  keywords:
  - release
  - semver
  - latest
  - backport
  - classifier
  artifact: internal/release; RED scaffold today (internal/release/release.go)
  related:
  - OUT-26
  superseded_by: null
- id: OUT-19
  kind: invariant
  summary: 'One ledgerops database per Postgres cluster: a fresh migrate refuses when ledgerops_app already
    exists in the cluster; the role claim is atomic (DDD-41, DDD-48).'
  feature: container-image-release
  inputs:
  - shape: migrate against an empty database in a cluster that already has ledgerops_app, or two simultaneous
      first migrations
  output:
    shape: refusal naming the conflict and the remedies (migrate the owning database, use a separate cluster,
      DROP ROLE ledgerops_app when the owner no longer exists); exactly one concurrent winner; role, password
      and both databases unchanged
  keywords:
  - cluster
  - role-claim
  - pg_authid
  - concurrency
  artifact: internal/adapters/postgres (role claim, PlanMigration); RED scaffold today (migrate_plan.go)
  related:
  - OUT-15
  superseded_by: null
