  kind: invariant
  summary: 'Rule A: on a database a migrate run created, ledgerops_app accepts no password the operator
    did not supply, at any instant, including after a crash (ADR-017).'
  feature: container-image-release
  inputs:
  - shape: any observation during or after a fresh migrate, killed or not
  output:
