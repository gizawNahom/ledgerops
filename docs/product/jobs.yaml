# Validated jobs for ledgerops.
#
# EVIDENCE CAVEAT: these jobs, forces, and opportunity scores are founder-estimated.
# No DISCOVER wave has run; no user interviews back them. They are a defensible
# prioritisation heuristic, not evidence. Revisit after the first real integration.

meta:
  bootstrapped_by: ledger-core
  wave: DISCUSS
  date: 2026-08-17
  evidence_basis: founder-estimated
  approved_by_user: true

personas:
  - id: P1
    name: Integrating developer
    ref: personas/integrating-developer.yaml
    evidence: archetype-unvalidated
  - id: P2
    name: Platform operator
    ref: personas/platform-operator.yaml
    evidence: real-project-owner

jobs:
  - id: J1
    persona: P1
    story: >
      When I move value between users, I want it recorded so money can never be
      created or destroyed by a failure mid-write, so I can trust every balance
      without building my own reconciliation.
    dimensions:
      functional: Record a value movement as an indivisible unit.
      emotional: Stop worrying that the numbers are quietly wrong.
      social: Be the engineer who did not lose customer money.
    forces:
      push: Two UPDATE statements can half-apply; failures destroy value silently.
      pull: A write that either lands completely or not at all.
      anxiety: Trusting money to unproven code.
      habit: A balance column updated in place, with no record of movement.
    invariant: I1
    importance: 10
    satisfaction: 2
    opportunity: 18
    slice: "01"

  - id: J2
    persona: P1
    story: >
      When my client retries after a network timeout, I want the transfer to post
      exactly once, so I never double-charge a user.
    dimensions:
      functional: Deduplicate a resubmitted request.
      emotional: Retry without fear.
      social: Never explain a double charge to a customer.
    forces:
      push: Timeouts are indistinguishable from failures; retries are unavoidable.
      pull: Safe-to-retry writes.
      anxiety: Trusting money to unproven code.
      habit: Hoping it does not happen, or checking for a duplicate by hand.
    invariant: I7
    importance: 9
    satisfaction: 1
    opportunity: 17
    slice: "03"

  - id: J3
    persona: P1
    story: >
      When a user tries to spend more than they hold, I want the transfer rejected
      even under concurrent requests, so I never have to explain a negative balance.
    dimensions:
      functional: Enforce sufficient funds at the moment of posting.
      emotional: Confidence that the rule cannot be raced.
      social: Not the platform where people spend money they do not have.
    forces:
      push: Read-then-write checks pass twice under concurrency.
      pull: A check that holds under contention.
      anxiety: Trusting money to unproven code.
      habit: Checking the balance in application code before writing.
    invariant: I4
    importance: 9
    satisfaction: 2
    opportunity: 16
    slice: "02"

  - id: J5
    persona: P2
    story: >
      When a balance looks wrong, I want to trace it to the exact entries that
      produced it, so I can explain what actually happened.
    dimensions:
      functional: Drill from a balance to its constituent entries.
      emotional: Replace suspicion with an answer.
      social: Give a straight account when someone asks where the money went.
    forces:
      push: A bare balance number cannot be argued with or corrected.
      pull: Every balance is explainable from its history.
      anxiety: Trusting money to unproven code.
      habit: Querying the database by hand and reconstructing by eye.
    invariant: null
    importance: 8
    satisfaction: 2
    opportunity: 14
    slice: "05"
    consumed_by: [ledger-core (backend, GET /accounts/{id}/entries), ledger-core-console (browser trace UI, US-3)]

  - id: J4
    persona: P2
    story: >
      When I am accountable for platform funds, I want to see that the books
      balance, so I catch corruption before customers report it.
    dimensions:
      functional: Verify stored balances agree with recorded entries.
      emotional: Sleep without wondering.
      social: Detect problems before users do.
    forces:
      push: Silent drift is invisible until a customer complains.
      pull: A single view that says the books are sound.
      anxiety: Trusting money to unproven code.
      habit: Assuming correctness because nothing has broken yet.
    invariant: I3
    importance: 7
    satisfaction: 1
    opportunity: 13
    slice: "04"
    consumed_by: [ledger-core (backend, GET /console/verdict, GET /health/trial-balance), ledger-core-console (browser verdict + drift UI, US-1/US-2/US-4)]

  - id: J6
    persona: P1
    story: >
      When I build a product on ledgerops that will serve more than one customer
      organization, I want each customer's accounts, transactions, and balances
      completely isolated from every other customer sharing the platform, so I
      can take on a third party's money without becoming the reason it mixes
      with anyone else's.
    dimensions:
      functional: Partition every account, transaction, and balance query by tenant, with no cross-tenant read or write path.
      emotional: Stop being personally liable for one customer's mistake or breach leaking into another's books.
      social: Be trusted to hold money for multiple unrelated third parties on shared infrastructure.
    forces:
      push: A single shared account namespace lets two customers collide on names, and a shared credential lets one customer's integration bug reach another's balance.
      pull: Every request is scoped to exactly one tenant, provably, before any domain rule runs.
      anxiety: Trusting a shared deployment with money belonging to parties who do not trust each other.
      habit: Running one ledgerops instance per customer, or trusting a shared instance with no isolation guarantee.
    invariant: I8
    importance: 9
    satisfaction: 1
    opportunity: 17
    slice: "01-02"
    reactivated: >
      2026-09-03, by feature `multitenancy`. Originally dropped from ledger-core
      scope 2026-08-17 (single-tenant deferral). Reactivation trigger: the
      deferral's own stated condition — "revisit before any third party's money
      is held" — is what this feature exists to satisfy.

  - id: J7
    persona: P2
    story: >
      When I operate a shared ledgerops deployment on behalf of more than one
      tenant, I want to onboard a new tenant and check that tenant's books
      balance on their own, without auditing every account by hand to convince
      myself nothing leaked between customers, so I can take on a new customer
      without personally re-verifying the whole platform's isolation guarantee.
    dimensions:
      functional: Provision a new tenant and verify one tenant's trial balance independent of every other tenant's state.
      emotional: Trust the platform's isolation by construction, not by manual cross-checking.
      social: Onboard a new customer without asking them to trust a promise nobody has demonstrated.
    forces:
      push: There is no way to ask "does this one customer's slice of the ledger balance?" once more than one customer shares a deployment.
      pull: A per-tenant verdict, exactly as trustworthy as today's single-tenant one.
      anxiety: Onboarding tenant two accidentally proves tenant one's isolation was never real.
      habit: One ledgerops deployment per customer, so there is nothing to isolate.
    invariant: null
    importance: 7
    satisfaction: 1
    opportunity: 13
    slice: "01-03"

deferred:
  - id: J8
    title: Inter-tenant settlement (platform-mediated)
    reason: >
      Raised during multitenancy's DISCUSS wave (2026-09-03) — the user needs
      rare inter-company settlement between two tenants. Resolved shape: two
      linked transactions through a platform clearing account, run as a saga
      (initiated -> A debited -> settled, reversed if the B-leg fails); each
      tenant's own ledger stays independently zero-sum. Authorization is
      platform-mediated settlement authority — a tenant's own credential only
      ever touches its own accounts, so isolation (J6) is never violated by
      this mechanism. Likely extends the existing two-role service-credential
      precedent (ledger-core OPS-10: ledgerops_app vs ledgerops_migrate) with
      a third, platform-settlement-scoped credential — noted for this
      feature's own future DESIGN pass, not decided here. Kept out of
      `multitenancy` deliberately: depends on tenant isolation shipping
      first, and folding it into slice 02 would bloat that slice and muddy
      the isolation-proof (race) demo. Revisit as its own follow-on feature
      once multitenancy's isolation slices are done.
    depends_on: multitenancy
    invariant: null
    persona: [P1, P2]
