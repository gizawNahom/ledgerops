# kpi-contracts.yaml — instrumentation SSOT
#
# One entry per outcome KPI, across all features. Source of the targets: each
# feature's own DISCUSS wave § Outcome KPIs table
# (docs/feature/ledger-core/feature-delta.md:183 for KPI-1..6, KPI-C1..C3;
# docs/feature/multitenancy/feature-delta.md § Wave: DISCUSS / Outcome KPIs
# for KPI-M1..M4; docs/feature/container-image-release/feature-delta.md §
# Wave: DISCUSS / Outcome KPIs for KPI-R1..R9). This file adds the DEVOPS layer:
# where the number comes from, what emits it, and what makes the build fail.
#
# Character of this set: nearly all KPIs are CI assertions, not production
# telemetry. There is no hosted environment for any feature in this project
# (DEVOPS D1/OPS-1), and outcomes are correctness properties rather than usage
# or performance. A KPI here is therefore normally a gate, and its "dashboard"
# is the CI job summary.

schema_version: "0.1"

kpis:
  - id: KPI-1
    name: Trial balance integrity
    feature: ledger-core
    target: "100% of CI runs report zero imbalance on a healthy ledger"
    class: gate
    collected_by:
      surface: "GET /health/trial-balance"
      fields: ["imbalance_minor", "entry_count", "elapsed_ms"]
      environment: [ci, populated, corrupted]
    assertion: "imbalance_minor == 0"
    emitted_as:
      ci_job: invariant-gates
      summary_line: "trial_balance_imbalance_minor=<n> entry_count=<n> elapsed_ms=<n>"
      runtime_metric: "ledgerops_trial_balance_imbalance_minor (gauge)"
    fails_build: true
    guardrail:
      metric: elapsed_ms
      threshold_ms: 2000
      action: "warn only — D9 deferred checkpointing; this is the trigger to revisit, not a failure"
      note: >
        `corrupted` added 2026-08-18 (DISTILL finding U-2, confirmed by DEVOPS
        review). The corrupted environment is reached from populated and runs
        the most expensive scan of the three — the one that must attribute
        drift across every account. Omitting it left the guardrail blind to the
        case whose cost grows fastest as history accumulates, which is exactly
        the case D9's deferral was betting against.

  - id: KPI-2
    name: Negative wallet balances
    feature: ledger-core
    target: "0 across a 1000-iteration concurrency test"
    class: gate
    collected_by:
      surface: "make race-02"
      fields: ["iterations", "negative_balance_observations", "rejections_422"]
      environment: [contended]
    assertion: "negative_balance_observations == 0 AND iterations >= 1000"
    emitted_as:
      ci_job: invariant-gates
      summary_line: "race02_iterations=<n> negatives=<n> rejections=<n>"
      runtime_metric: "ledgerops_insufficient_funds_rejections_total (counter)"
    fails_build: true
    note: >
      iterations is asserted alongside the observation count. A harness that
      silently ran 10 iterations would otherwise report zero negatives and pass.

  - id: KPI-3
    name: Idempotent posting
    feature: ledger-core
    target: "Exactly 1 transaction from 50 concurrent same-key submissions"
    class: gate
    collected_by:
      surface: "make race-03"
      fields: ["submissions", "distinct_transaction_ids", "entry_pairs_stored"]
      environment: [contended]
    assertion: "distinct_transaction_ids == 1 AND entry_pairs_stored == 1 AND submissions >= 50"
    emitted_as:
      ci_job: invariant-gates
      summary_line: "race03_submissions=<n> distinct_txn=<n> entry_pairs=<n>"
      runtime_metric: "ledgerops_idempotent_replays_total (counter)"
    fails_build: true
    note: >
      Both distinct_transaction_ids and entry_pairs_stored are asserted. The
      first catches a broken replay response, the second catches a double write
      that happens to render the same id.

  - id: KPI-4
    name: Corruption detection
    feature: ledger-core
    target: "100% of injected single-entry corruptions caught"
    class: gate
    collected_by:
      surface: "make corrupt-04"
      fields: ["injections", "detected", "account_named_correctly", "delta_correct"]
      environment: [corrupted]
    assertion: "detected == injections AND account_named_correctly == injections AND delta_correct == injections"
    emitted_as:
      ci_job: invariant-gates
      summary_line: "corrupt04_injected=<n> detected=<n> named=<n> delta_ok=<n>"
      runtime_metric: "ledgerops_drift_accounts (gauge)"
    fails_build: true
    note: >
      Detection alone is not the outcome. US-4's pitch promises the verdict
      names the account and the delta, so both are asserted — a verdict of NO
      with no attribution would pass a detection-only check and fail the user.

  - id: KPI-5
    name: Time to first demo
    feature: ledger-core
    target: "Clone to `make demo-01` green in under 5 minutes"
    class: gate
    collected_by:
      surface: "CI demo job wall-clock, checkout to `make demo-01` exit 0"
      fields: ["demo_first_green_seconds"]
      environment: [clean, ci]
    assertion: "demo_first_green_seconds < 300"
    emitted_as:
      ci_job: demo
      summary_line: "demo_first_green_seconds=<n>"
    fails_build: true
    caveat: >
      The CI runner is a warm-image proxy for a developer's clean machine, not
      the same thing — image pulls may be cached. Treat a CI regression as real
      and a CI pass as necessary-but-not-sufficient. The KPI's stated
      measurement ("timed on a clean machine") stays a periodic manual check.
    rebaseline:
      date: "2026-10-17"
      feature: container-image-release
      reason: >
        The image build gains a Node stage that builds and embeds the console
        (ADR-019, slice 05), so `make up` and the `demo` job build the SPA.
      before:
        value_seconds: [71, 70, 68]
        evidence: "demo step of ci.yml on green main runs 38962444215, 38964268513, 38965301338 (2026-10-16), via the GitHub Actions jobs API"
      expected_after:
        value_seconds: 135
        basis: "local cold measurement in node:22-slim: npm ci 61 s + vite build 3 s added to the ~70 s above. BuildKit npm cache mounts do not help a fresh CI runner (empty cache); the second compose service sharing the image tag is a layer-cache hit"
        status: "estimate; replace with the measured value when slice 05 lands"
      target_unchanged: "demo_first_green_seconds < 300 (assertion above)"
      guardrail:
        threshold_seconds: 200
        action: "warn only, same pattern as KPI-1's elapsed_ms guardrail; revisit caching (BuildKit gha cache) if it trips"
        emitted_by: "ci.yml demo job, step after the timing step: ::warning title=KPI-5 annotation when demo_first_green_seconds > 200; never fails the job"

  - id: KPI-C1
    name: Books-balance check without a terminal
    feature: ledger-core-console
    target: "100% of routine checks resolved from the console alone, 0 curl calls"
    class: manual
    collected_by:
      surface: "manual dogfood checklist — see docs/feature/ledger-core-console/feature-delta.md § Wave: DEVOPS / Monitoring contracts"
      fields: ["curl_calls_avoided (self-report)"]
      environment: [with-stored-key]
    assertion: "none — self-report during demo and first week of use, not CI-gated"
    emitted_as:
      ci_job: none
      summary_line: "n/a — no dashboard; recorded as a checklist item per demo"
    fails_build: false
    note: >
      DISCUSS's Outcome KPIs section (feature-delta.md) explicitly scopes this
      as "Manual dogfood observation during demo; self-report" — no hosted
      environment exists to emit production telemetry from (inherited DEVOPS
      D1), and DDR-2 forbids a new automated browser probe. Building
      instrumentation infrastructure for a KPI DISCUSS scoped as manual would
      be over-engineering, not thoroughness.

  - id: KPI-C2
    name: Drift explanation without a terminal
    feature: ledger-core-console
    target: "100% of corruption incidents identified via console UI alone, 0 curl calls to /accounts/{id}/entries"
    class: manual
    collected_by:
      surface: "manual dogfood checklist — see docs/feature/ledger-core-console/feature-delta.md § Wave: DEVOPS / Monitoring contracts"
      fields: ["curl_calls_avoided (self-report)"]
      environment: [with-stored-key]
    assertion: "none — self-report during corruption demo, not CI-gated"
    emitted_as:
      ci_job: none
      summary_line: "n/a — no dashboard"
    fails_build: false
    note: "Same manual-observation framing as KPI-C1; see that entry's note."

  - id: KPI-C3
    name: Console/health-check verdict agreement (guardrail)
    feature: ledger-core-console
    target: "100% agreement between console verdict and GET /health/trial-balance, every demo run"
    class: manual
    collected_by:
      surface: "manual comparison during each demo; no client-side reconciliation logic exists to audit"
      fields: []
      environment: [with-stored-key, api-unreachable]
    assertion: "none — guardrail is structural (apiClient never recomputes a verdict; DESIGN § Component decomposition), not measured by a metric"
    emitted_as:
      ci_job: none
      summary_line: "n/a"
    fails_build: false
    note: >
      Guardrail already holds at the HTTP contract level
      (milestone-04-proof-of-balance.feature, "The console and the health
      check give the operator the same answer"), since GET /console/verdict
      and GET /health/trial-balance share verdictHandler
      (internal/adapters/http/router.go). This KPI's job is to catch a future
      regression where the SPA adds client-side verdict logic that could
      diverge — a code-review/design-review concern, not a runtime metric.

  - id: KPI-6
    name: Slice cycle time
    feature: ledger-core
    target: "Each slice shipped within 1 day"
    class: observed
    collected_by:
      surface: "git metadata — first commit touching docs/feature/ledger-core/slices/slice-NN* to the slice-NN-shipped tag"
      fields: ["slice_id", "elapsed_hours"]
      environment: [ci]
    assertion: "none — reported, not gated"
    emitted_as:
      ci_job: nightly
      summary_line: "slice=<NN> elapsed_hours=<n>"
    fails_build: false
    note: >
      A process metric, not a product one. Gating on it would create an
      incentive to under-scope a slice rather than to work faster, so it is
      reported and read by a human. Requires the `slice-NN-shipped` tag
      convention to be honoured by DELIVER.

  - id: KPI-M1
    name: Cross-tenant access refusal
    feature: multitenancy
    target: "100% of adversarial cross-tenant attempts refused, across the full acceptance suite"
    class: gate
    collected_by:
      surface: "tenant-isolation-gates CI job — adversarial cross-tenant read/write scenarios in every slice's acceptance suite"
      fields: ["cross_tenant_attempts", "cross_tenant_refused"]
      environment: [two-tenant, ci]
    assertion: "cross_tenant_refused == cross_tenant_attempts AND cross_tenant_attempts > 0"
    emitted_as:
      ci_job: tenant-isolation-gates
      summary_line: "cross_tenant_attempts=<n> refused=<n>"
    fails_build: true
    note: >
      North Star per DISCUSS § Outcome KPIs — this is a security property,
      not an optimization target; 100% is the only acceptable value. Scope
      note: measures tenant-credential-initiated cross-tenant access only —
      the future platform-mediated settlement feature (jobs.yaml J8) is a
      distinct, deliberately-authorized channel this KPI does not cover.
      The attempts > 0 denominator guards against a harness that quietly
      ran zero adversarial attempts and passed vacuously — same pattern as
      ledger-core's KPI-2/KPI-3 iteration-count assertions.
    measured:
      date: "2026-09-05"
      result: "18/18 multitenancy acceptance scenarios passing (102/102 steps), including every adversarial cross-tenant read/write scenario"
      evidence: "docs/feature/multitenancy/feature-delta.md § Wave: DELIVER / Demo Evidence"
      status: PASS

  - id: KPI-M2
    name: Tenant onboarding to first transfer
    feature: multitenancy
    target: "Provision a tenant and post that tenant's first successful transfer within a single make demo-04 run"
    class: gate
    collected_by:
      surface: "CI demo job wall-clock, make demo-04 (provision tenant, first transfer)"
      fields: ["tenant_onboard_transfer_seconds"]
      environment: [clean, ci]
    assertion: "demo-04 exits 0 AND tenant_onboard_transfer_seconds < 300"
    emitted_as:
      ci_job: demo
      summary_line: "tenant_onboard_transfer_seconds=<n>"
    fails_build: true
    note: >
      Mirrors KPI-5's pattern (DISCUSS's own stated framing). The 300s
      threshold is adopted directly from KPI-5 rather than independently
      invented, since DISCUSS did not state a separate number for this KPI.
      Same CI-runner-as-warm-image-proxy caveat as KPI-5 applies.
    measured:
      date: "2026-09-05"
      result: "tenant_onboard_transfer_seconds=0, well under the 300s threshold"
      evidence: "docs/feature/multitenancy/feature-delta.md § Wave: DELIVER / Demo Evidence (make demo-04)"
      status: PASS

  - id: KPI-M3
    name: Per-tenant trial-balance correctness
    feature: multitenancy
    target: "100% of CI runs report the checked tenant's own state only, never another tenant's, while that other tenant is drifted or mid-transaction"
    class: gate
    collected_by:
      surface: "tenant-isolation-gates CI job — GET /health/trial-balance?tenant_id=... against the two-tenant environment"
      fields: ["checked_tenant_id", "imbalance_minor", "other_tenant_leaked"]
      environment: [two-tenant, ci]
    assertion: "other_tenant_leaked == false"
    emitted_as:
      ci_job: tenant-isolation-gates
      summary_line: "trial_balance_tenant=<id> imbalance_minor=<n> leaked=<bool>"
    fails_build: true
    note: >
      Mirrors KPI-1's pattern (invariant-gates-style job). Not gated in the
      contended/corrupted concurrency-race environments ledger-core's KPI-1
      partially uses — I8/I9/I10 are correctness properties proven via the
      normal acceptance suite, not contention properties, per this feature's
      own DEVOPS scope decision.
    measured:
      date: "2026-09-05"
      result: "18/18 multitenancy acceptance scenarios passing, including US-3's isolated per-tenant verdict scenarios; scoped GET /health/trial-balance?tenant_id=tnt_1 verified to name only that tenant"
      evidence: "docs/feature/multitenancy/feature-delta.md § Wave: DELIVER / Demo Evidence"
      status: PASS

  - id: KPI-M4
    name: Console-compatibility guardrail
    feature: multitenancy
    target: "Byte-identical response shape and status for unscoped OperatorKey calls to GET /console/verdict, GET /accounts/{id}/entries, and GET /health/trial-balance, throughout every slice"
    class: gate
    collected_by:
      surface: "console-compat CI job — dual-mode acceptance scenarios (unscoped OperatorKey vs scoped tenant_key) in slices 02/03's own acceptance suites"
      fields: ["endpoint", "response_diff"]
      environment: [two-tenant, ci]
    assertion: "response_diff == none for all three endpoints"
    emitted_as:
      ci_job: console-compat
      summary_line: "console_compat_endpoint=<name> diff=<none|detected>"
    fails_build: true
    note: >
      Added 2026-09-03 amendment to DISCUSS's Guardrail Metrics — enforced as
      a CI-gated API-contract guarantee, deliberately not gated on
      ledger-core-console's own manual, non-CI KPIs (KPI-C1/C2/C3 below,
      fails_build: false), per peer-review iteration 2's remediation
      (feature-delta.md § Wave: DISCUSS / Changed Assumptions). KPI-C1/C2/C3
      remain that feature's own separate self-reported responsibility, not
      duplicated here.
    amendments:
      - date: "2026-10-16"
        approved_by: user
        feature: fix-trial-balance-tenant-collision
        text: >
          Unscoped GET /health/trial-balance and GET /console/verdict drift
          rows gained one additive field, `tenant_id`, via
          fix-trial-balance-tenant-collision. On a single-tenant ledger with
          drift, rows read `"tenant_id":"tnt_legacy_seed"`; the no-drift
          response stays byte-identical. Reason: an operator must be able to
          tell which tenant's same-named account drifted. The target above is
          unchanged for every no-drift response; only the drift-row shape
          differs, and only by this one field.
      - date: "2026-10-16"
        approved_by: user
        feature: fix-unscoped-entries-tenant-merge
        text: >
          Unscoped OperatorKey GET /accounts/{id}/entries rows gained one
          additive field, `tenant_id`, and are grouped by tenant with a
          per-tenant running_balance, via fix-unscoped-entries-tenant-merge.
          On a single-tenant ledger, rows read `"tenant_id":"tnt_legacy_seed"`;
          the response otherwise keeps its fields and status. An optional,
          operator-only `?tenant_id=` narrows the read. Reason: an operator
          must be able to tell whose entries they are reading. The target
          above is unchanged.
    measured:
      date: "2026-09-05"
      result: "the 3 @console-compat scenarios (within the 18) passing, plus the pre-existing tests/acceptance/ledgercore suite restored to a full pass (296.8s) after OPS-13's fix - the regression proof that unscoped OperatorKey calls to all three named endpoints kept working throughout"
      evidence: "docs/feature/multitenancy/feature-delta.md § Wave: DELIVER / Demo Evidence"
      status: PASS

  # ---- container-image-release (KPI-R1..R9) ---------------------------------
  # Release-gate and acceptance assertions. No production telemetry exists
  # (DEVOPS OPS-1); the "dashboard" for each is the release run's job summary
  # (one table per run). `ci_job` names a job in .github/workflows/release.yml
  # unless it says ci.yml. Targets: feature-delta.md § DISCUSS / Outcome KPIs
  # (K1..K7 -> KPI-R1..R7; the US-1b cluster-refusal KPI -> KPI-R8; the US-2
  # refuse-at-start KPI -> KPI-R9). Wired by DEVOPS 2026-10-17.

  - id: KPI-R1
    name: Pull to healthy service
    feature: container-image-release
    target: "From docker pull to a healthy service in at most 120 s on the CI runner; at most 10 min from pull to first posted transfer by the quickstart"
    class: gate
    collected_by:
      surface: "scripts/smoke (per architecture) and scripts/quickstart, both timing their own run"
      fields: ["smoke_pull_to_healthy_seconds", "quickstart_pull_to_first_transfer_seconds", "arch"]
      environment: [image-amd64, image-arm64, fresh-pg16-cluster, ghcr-public-package]
    assertion: "smoke_pull_to_healthy_seconds <= 120 for every arch AND quickstart_pull_to_first_transfer_seconds <= 600"
    emitted_as:
      ci_job: "smoke (per matrix arch); quickstart"
      summary_line: "smoke_pull_to_healthy_seconds=<n> arch=<amd64|arm64>; quickstart_pull_to_first_transfer_seconds=<n>"
    fails_build: true
    note: >
      North star (K1). Failing smoke leaves an untagged digest and no version
      tag (digest-first order, ADR-020). A failing quickstart after release is a
      red run, not an unpublished release: the document or checker is fixed and
      the job re-run. The 120 s bound is on a warm CI runner, a proxy for a
      user's network; treat a regression as real, a pass as necessary only.

  - id: KPI-R2
    name: Only images that migrate and serve are promoted
    feature: container-image-release
    target: "100% of releases pass smoke (and signing and the anonymous-pull probe) before any version tag or latest moves"
    class: gate
    collected_by:
      surface: "structure of release.yml (needs graph) asserted by a test in workflow-guards; promote job summary"
      fields: ["promote_needs_smoke_and_probe", "all_jobs_need_ci", "if_clauses_complete", "latest_moved", "move_latest_planned"]
      environment: [release-ci]
    assertion: "if_clauses_complete == true (each downstream job's if: is !cancelled() plus an explicit success clause for every dependency) AND all_jobs_need_ci == true (every job after classify, resume path included) AND promote_needs_smoke_and_probe == true (and sign from slice 07; anon-probe also needs sign) AND (latest_moved implies move_latest_planned)"
    emitted_as:
      ci_job: "ci.yml workflow-guards; release.yml promote"
      summary_line: "needs_ci=<bool> if_clauses_complete=<bool> promote_needs=smoke,anon-probe latest_moved=<bool> planned=<bool>"
    fails_build: true
    note: >
      Enforced by construction (job dependencies), then checked structurally so
      a later edit cannot quietly reorder it. Without the structural test this
      KPI would be an assertion about intent rather than about the workflow.

  - id: KPI-R3
    name: App role only accepts a password the operator supplied
    feature: container-image-release
    target: "100% refusal of app-secret and 100% login with the supplied password in fresh-database runs; plaintext never in the server log"
    class: gate
    collected_by:
      surface: "acceptance suite in a dedicated cluster; release smoke fresh leg; ddl-logging-cluster run"
      fields: ["app_secret_login_refused", "supplied_password_login_ok", "plaintext_in_server_log", "observations"]
      environment: [fresh-pg16-cluster, ddl-logging-cluster, dirty-migration, scram-unicode, rule-b-interrupted]
    assertion: "app_secret_login_refused == observations AND supplied_password_login_ok == true AND plaintext_in_server_log == false"
    emitted_as:
      ci_job: "ci.yml container-acceptance; release.yml smoke"
      summary_line: "app_secret_login_refused=<n>/<n> supplied_password_login_ok=<bool> plaintext_in_server_log=<bool>"
    fails_build: true
    note: >
      DISCUSS classes this a Guardrail; gated here. Rule A is observed after every schema step and after a kill, not only at
      the end. `observations > 0` is implied by comparing against the count so
      a harness that observed nothing cannot pass vacuously.

  - id: KPI-R4
    name: Upgrade in place without data change
    feature: container-image-release
    target: "100% of upgrade runs preserve every entry and balance, with a zero trial balance"
    class: gate
    collected_by:
      surface: "upgrade acceptance seeded from the frozen pre-feature migrations; release smoke upgrade leg"
      fields: ["entries_before", "entries_after", "imbalance_minor", "append_only_holds"]
      environment: [legacy-demo-db]
    assertion: "entries_after == entries_before AND imbalance_minor == 0 AND append_only_holds == true"
    emitted_as:
      ci_job: "ci.yml container-acceptance; release.yml smoke"
      summary_line: "upgrade_entries_before=<n> after=<n> imbalance_minor=<n>"
    fails_build: true

  - id: KPI-R5
    name: Provenance verifiable
    feature: container-image-release
    target: "100% of stable releases pass cosign verify and carry a per-platform SBOM attestation, verified anonymously"
    class: gate
    collected_by:
      surface: "sign job verification steps; quickstart job (no registry login)"
      fields: ["signatures_per_digest_min", "sbom_attestations_per_platform_min", "cert_identity", "signature_storage"]
      environment: [release-ci, ghcr-public-package]
    assertion: "signatures_per_digest_min >= 1 over the index digest and every platform digest AND sbom_attestations_per_platform_min >= 1 over every platform digest AND cert_identity matches the published exact-case regex"
    emitted_as:
      ci_job: "sign; quickstart (slice 07 onwards)"
      summary_line: "signatures_per_digest_min=<n> sbom_attestations_per_platform_min=<n> signature_storage=<tag-fallback|referrers|both> identity=<san>"
    fails_build: true
    note: >
      User-decided (OPS-24): the published regex uses the exact case
      gizawNahom. The first rc prints the real certificate identity and the
      job asserts the regex matches it. `signature_storage` is expected to be
      tag-fallback on GHCR (referrers endpoint answered 404 on 2026-10-17) and
      is recorded, not gated, except that `none` fails.

  - id: KPI-R6
    name: Console served from the image
    feature: container-image-release
    target: "100% of published images answer 200 on /console"
    class: gate
    collected_by:
      surface: "release smoke (slice 05 onwards)"
      fields: ["console_http_status", "arch"]
      environment: [image-amd64, image-arm64]
    assertion: "console_http_status == 200 for every arch"
    emitted_as:
      ci_job: "smoke"
      summary_line: "console_http_status=<code> arch=<arch>"
    fails_build: true

  - id: KPI-R7
    name: Both architectures and correct labels
    feature: container-image-release
    target: "100% of releases list linux/amd64 and linux/arm64 and carry correct version, revision and source labels"
    class: gate
    collected_by:
      surface: "promote job verification step reading the index and the image config (slice 06)"
      fields: ["index_platforms", "label_version", "label_revision", "label_source"]
      environment: [image-amd64, image-arm64, release-ci]
    assertion: "index_platforms == [linux/amd64, linux/arm64] exactly AND label_version == plan version AND label_revision == tagged commit AND label_source == repository URL"
    emitted_as:
      ci_job: "promote"
      summary_line: "index_platforms=<list> label_version=<v> label_revision=<sha7> label_source=<url>"
    fails_build: true
    note: >
      "Exactly" matters: provenance and BuildKit SBOM attestations are off so
      the index holds no unknown/unknown manifests (DEVOPS OPS-14). Slice 03
      ships amd64 only; this KPI starts asserting in slice 06.

  - id: KPI-R8
    name: Second ledgerops database refused, never shared
    feature: container-image-release
    target: "100% of second-database runs refuse with role, password and both databases unchanged; 0 concurrent first migrations both succeed"
    class: gate
    collected_by:
      surface: "acceptance suite in a dedicated cluster (US-1b), including the two-simultaneous-runs scenario"
      fields: ["second_db_attempts", "second_db_refusals", "concurrent_winners", "unchanged_universe"]
      environment: [role-exists-other-db, same-db-concurrent]
    assertion: "second_db_refusals == second_db_attempts AND concurrent_winners == 1 AND unchanged_universe == true"
    emitted_as:
      ci_job: "ci.yml container-acceptance"
      summary_line: "second_db_attempts=<n> second_db_refusals=<n>/<n> concurrent_winners=<n> unchanged_universe=<bool>"
    fails_build: true
    note: "DISCUSS lists this under the K3 family. `unchanged_universe` is the before/after catalog snapshot diff named in DESIGN's contract shapes."

  - id: KPI-R9
    name: Misconfiguration refused at start
    feature: container-image-release
    target: "100% of missing-variable runs refuse at start; 0 start silently"
    class: gate
    collected_by:
      surface: "acceptance suite (process exit status and message, no database connection made)"
      fields: ["missing_var_runs", "refused_at_start", "secrets_in_output"]
      environment: [serve-config, wrong-password-start]
    assertion: "refused_at_start == missing_var_runs AND secrets_in_output == false"
    emitted_as:
      ci_job: "ci.yml container-acceptance"
      summary_line: "missing_var_runs=<n> refused_at_start=<n> secrets_in_output=<bool>"
    fails_build: true
    note: "US-2's own KPI; not among K1-K7 but a stated story outcome, so wired rather than left implicit."

runtime_instrumentation:
  # Secondary tier. No hosted environment exists, so these exist to be correct
  # and scrapeable rather than to be watched. They cost little now and cost a
  # lot to retrofit once there is traffic.
  logs:
    format: "JSON via log/slog to stdout"
    required_fields: [ts, level, msg, request_id, route, status, elapsed_ms]
    conditional_fields:
      posting: [transaction_id, account_ids, amount_minor, currency]
      idempotency: [idempotency_key_hash, replayed]
      violation: [violation_kind]
    redaction:
      - "idempotency_key is logged hashed, never raw — it is client-chosen and may carry caller-side identifiers"
      - "API keys never logged, including in request-echo error paths"
  metrics:
    exposition: "Prometheus text format at GET /metrics"
    scraped_by: "nothing yet — no Prometheus deployed (DEVOPS D5)"
    series:
      - "ledgerops_postings_total{result=posted|rejected|replayed} (counter)"
      - "ledgerops_posting_duration_seconds (histogram)"
      - "ledgerops_insufficient_funds_rejections_total (counter)"
      - "ledgerops_idempotent_replays_total (counter)"
      - "ledgerops_trial_balance_imbalance_minor (gauge)"
      - "ledgerops_trial_balance_scan_duration_seconds (histogram)"
      - "ledgerops_drift_accounts (gauge)"
  traces:
    status: "not implemented"
    rationale: >
      One process, one database, no network hops between components. A trace
      would contain a single meaningful span that posting_duration_seconds
      already reports. Revisit if a second service appears.

alerting:
  status: "none"
  rationale: >
    Alerting requires a running environment and someone on call. Neither
    exists (DEVOPS D1, D7). DISCUSS placed alerting and scheduled checks
    explicitly out of scope (feature-delta.md:140). The metrics above are the
    substrate an alert would need; the alert itself is deferred.
  first_alerts_when_hosted:
    - "ledgerops_trial_balance_imbalance_minor != 0 — page immediately"
    - "ledgerops_drift_accounts > 0 — page immediately"
    - "posting error rate 5xx > 1% over 5m — warn"
