id: verify-the-books
name: Verify the books
persona: P2
jobs: [J4, J5]
depth: comprehensive

mental_model: >
  The operator asks one question first -- "does this add up?" -- and wants a yes
  or no before any detail. Detail is what they need second, once the answer is no.
  A console that leads with tables of numbers answers the wrong question.

steps:
  - id: S1
    name: Open the console
    action: GET /console
    output: Trial balance figure, green when zero
    emotion: seeking reassurance
    confidence: 5
  - id: S2
    name: Read the verdict
    action: none -- the page states it
    output: "Books balance: YES | NO"
    emotion: relief or alarm
    confidence: 8 when green
    note: >
      This must be a sentence, not a table. The operator should not have to
      compute the verdict from displayed figures.
  - id: S3
    name: Spot a drifted account
    action: Console lists accounts whose stored balance disagrees with entries
    output: "account_id, stored, computed, delta"
    emotion: focused concern
    confidence: 6
  - id: S4
    name: Trace to entries
    action: GET /accounts/{id}/entries
    output: Ordered entries with running balance
    emotion: understanding
    confidence: 9
    note: The running balance column is what makes the break point visible.

emotional_arc:
  shape: dip-and-recover
  trough: S3
  peak: S4
  rationale: >
    Unlike the integrator journey, this one is allowed to dip. Discovering drift
    should feel alarming -- that is the console working. Confidence recovers at
    S4 because the operator can now explain the problem rather than only fear it.

shared_artifacts:
  - name: account_id
    source: S3 drift listing
    consumed_by: [S4]
  - name: computed_balance
    source: derived from entries at S3
    consumed_by: [S4]
    note: >
      Single source of truth is the entry table. The stored balance is the thing
      being checked, never the thing being trusted.

error_paths:
  - step: S2
    failure: Trial balance non-zero
    response: Console shows NO and lists offending accounts
    recovery: Operator proceeds to S3. This is a feature, not an error.
  - step: S1
    failure: Console unreachable
    response: n/a
    recovery: >
      Operator falls back to the API. The console must not be the only path to
      the verdict -- GET /health/trial-balance returns the same answer.

changelog:
  - date: "2026-08-25"
    feature: ledger-core-console
    change: >
      Formalized S1-S4 into the ledger-core-console feature's user stories
      (US-1..US-4). No step content changed -- this journey already fully
      specified the console before that feature existed. S1's "console
      unreachable" error path was narrowed at story level to the buildable
      case (page loads, data fetch fails); a fully unreachable page is an
      operational concern outside any SPA story's reach, recorded in that
      feature's slice-04 brief rather than here.
  - date: "2026-08-25"
    feature: ledger-core-console
    change: >
      Corrected orchestrator decision-point rerun (UX research depth:
      comprehensive, not lightweight). This journey's S1-S4 happy path and
      dip-and-recover arc were re-interrogated, not discarded -- they hold
      up. Console-specific states this document never had to consider
      (loading, verdict staleness, a second failure branch on the entries
      fetch, routine-vs-reactive trigger variants) are now elaborated in
      docs/feature/ledger-core-console/discuss/journey-console.yaml and
      journey-console-visual.md, which extend rather than replace this
      file. No S1-S4 field here was altered.
