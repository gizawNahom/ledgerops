id: onboard-and-isolate-a-tenant
name: Onboard and isolate a tenant
persona: P2
secondary_persona: P1
jobs: [J7, J6]
depth: lightweight

mental_model: >
  The operator (P2) thinks in terms of "can I take on a second customer without
  touching the first one's setup?" The integrator (P1) never thinks about
  tenancy directly — they hold one credential and it happens to only ever show
  them their own accounts. The isolation guarantee is meant to be invisible
  when it holds and impossible to miss when it is tested.

steps:
  - id: S1
    name: Provision a tenant
    persona: P2
    action: "POST /tenants {name} using the existing platform-admin credential (illustrative — DESIGN settles the exact port)"
    output: "{tenant_id, name, tenant_key}"
    emotion: routine confidence
    confidence: 5
    note: >
      Setup step, mirrors post-a-transfer S1 ("should be boring and
      forgettable"). tenant_key is minted once, here, and never regenerated by
      this flow.

  - id: S2
    name: Operate within a tenant
    persona: P1
    action: "POST /accounts and POST /transfers using the tenant's own tenant_key"
    output: "identical response shapes to today's single-tenant API"
    emotion: unremarkable
    confidence: 6
    note: >
      This step should feel like nothing changed for an integrator who only
      ever has one tenant. The API surface is unchanged; only the credential
      is new.

  - id: S3
    name: Prove isolation under an adversarial attempt
    persona: P1 and P2
    action: >
      A second tenant's credential (or the platform-admin credential without a
      tenant_id) attempts to read or post against the first tenant's account.
    output: "refused — account not found from the second tenant's point of view"
    emotion: trust confirmed
    confidence: 9
    note: >
      This is the core moment, not an edge case appended after the happy path
      — mirrors post-a-transfer's S5 pattern (confidence peaks on the
      adversarial step, not the setup step). J6/I8 exists to make this refusal
      true, and it is the step this whole feature is for.

  - id: S4
    name: Verify one tenant's books
    persona: P2
    action: "GET /health/trial-balance?tenant_id=... using the platform-admin credential"
    output: "{tenant_id, verdict: 'Books balance: YES', ...} scoped to that tenant alone"
    emotion: relief
    confidence: 9
    note: >
      Closes the loop with P2's existing verify-the-books mental model
      (docs/product/journeys/verify-the-books.yaml), now answering the
      question per-tenant instead of platform-wide.

emotional_arc:
  shape: rising
  trough: S1
  peak: S3
  rationale: >
    Same shape as post-a-transfer.yaml: confidence should not peak on
    provisioning succeeding, it should peak on the system surviving an attempt
    to cross a tenant boundary. Anyone can provision a tenant; the platform
    earns trust when a second tenant cannot touch the first one's data.

shared_artifacts:
  - name: tenant_id
    source: S1 response
    consumed_by: [S2 (implicitly, via tenant_key), S3, S4]
  - name: tenant_key
    source: S1 response
    consumed_by: [S2, S3]
    note: >
      New credential type. Relationship to the existing single OperatorKey is
      a DESIGN decision (feature-delta.md § Pre-requisites) — provisional
      recommendation: OperatorKey becomes the platform-admin credential;
      tenant_key is scoped to exactly one tenant.

error_paths:
  - step: S1
    failure: Tenant name collision
    response: "409 {error: tenant_already_exists} (illustrative — mirrors DDD-18/account_already_exists precedent)"
    recovery: Operator picks a different name; no state changed.
  - step: S2
    failure: No tenant credential presented, or credential does not resolve to a tenant
    response: "401 {error: unidentified_caller} (existing shape, unchanged)"
    recovery: Caller re-checks which tenant_key it is using.
  - step: S3
    failure: n/a — this IS the intended behavior, not a failure
    response: see S3 output
    recovery: n/a

open_questions_for_design:
  - "Does a cross-tenant read answer 404 (denies existence, stronger isolation posture) or 403 (confirms existence, more informative)? Journey assumes 404 — matches the project's existing minimal-information-leak posture (ADR-009's service_unavailable framing) — but DESIGN should confirm, not inherit by default."
  - "What does today's un-scoped GET /health/trial-balance mean once tenants exist? Deployment-wide across all tenants, or does it require tenant_id now? Backward-compatibility question for the already-shipped console."

changelog:
  - date: "2026-09-03"
    feature: multitenancy
    change: >
      New journey. Extends verify-the-books.yaml (P2) and post-a-transfer.yaml
      (P1) rather than replacing either — S2 and S4 above are the same API
      shapes those journeys already describe, scoped by tenant. Lightweight
      depth per Decision 3: happy path plus the one adversarial step (S3) that
      is this feature's entire reason to exist, and two error paths.
