name: Load test

# OPS-12 (feature-delta.md, 2026-08-29): manually-triggered only, never on
# push/PR/schedule, never a required check, never blocking as a required
# GitHub check. `load`/`stress`/`soak` thresholds stay informational
# (abortOnFail: false) — OPS-1 established no hosted environment exists
# yet, so there is no production SLO to enforce for those. `capacity`
# (added 2026-09-02, replacing the reverted USL/tier-sweep approach) is
# the exception: a real, gating (abortOnFail: true) check against a fixed,
# pinned hardware ceiling (docker-compose.loadtest.yml) — provisional and
# workflow_dispatch-only, but its k6 exit code is allowed to fail this job.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "k6 stages profile"
        type: choice
        options:
          - load
          - stress
          - soak
          - capacity
        default: load

jobs:
  k6-transfers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `capacity` runs against docker-compose.loadtest.yml's pinned
      # CPU/memory ceiling so a threshold breach reflects a stated hardware
      # limit, not whatever the runner happened to have free. The other
      # profiles keep the plain, unpinned stack.
      - name: Start the compose stack
        run: |
          if [ "${{ github.event.inputs.profile }}" = "capacity" ]; then
            docker compose -f docker-compose.yml -f docker-compose.loadtest.yml \
              up -d postgres migrate app prometheus grafana
          else
            docker compose up -d postgres migrate app prometheus grafana
          fi

      # Same intent as the Makefile `wait-app` target (poll the real driving
      # port rather than trust a container healthcheck), but checks curl's
      # own exit status too: on connection-refused curl reports code "000"
      # and exits non-zero, which wait-app's plain digit-regex would
      # wrongly treat as "answering". Requiring both excludes that case.
      - name: Wait for the app to accept requests
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H 'Authorization: Bearer demo-operator-key' \
                http://localhost:8080/accounts/__probe__)"
            status=$?
            if [ "$status" -eq 0 ] && [ "$code" != "000" ]; then
              echo "app is answering (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "app never answered after 60s"
          docker compose logs app
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 (${{ github.event.inputs.profile }} profile)
        # load/stress/soak: thresholds are informational (abortOnFail:
        # false in the script), but a breached threshold still exits k6
        # non-zero, so continue-on-error keeps that from failing this
        # non-required job. capacity: real gating thresholds — let it fail.
        continue-on-error: ${{ github.event.inputs.profile != 'capacity' }}
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          k6 run \
            --out experimental-prometheus-rw=http://localhost:9090/api/v1/write \
            --summary-export=k6-summary.json \
            tests/load/transfers.js

      - name: Publish k6 summary
        if: always()
        run: |
          if [ -f k6-summary.json ]; then
            echo "## k6 load test (${PROFILE} profile)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat k6-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          PROFILE: ${{ github.event.inputs.profile }}

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
